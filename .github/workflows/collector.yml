name: Scheduled Airfare Collector

on:
  schedule:
    # 06:00 and 18:00 UTC (11:30 AM and 11:30 PM IST)
    - cron: '0 6,18 * * *'
  # workflow_dispatch lets you manually click "Run workflow" anytime from the GitHub website
  workflow_dispatch:

# Grant the Action write permissions so it can commit and push data back to your repo
permissions:
  contents: write

jobs:
  run-collector:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out repository code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run the production collector
        run: |
          python collection/collector.py

      - name: 5. Commit and push newly collected data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          # Commit only if there are new files; otherwise exit cleanly without error
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated collection batch [skip ci]" && git push)
